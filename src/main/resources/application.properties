spring.application.name=luminalabs

spring.datasource.url=jdbc:postgresql://localhost:5433/luminalabs
spring.datasource.username=lumina
spring.datasource.password=lumina

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Usamos un AuthenticationProvider propio a proposito (ver SecurityConfig); oculta el aviso al arrancar
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Idioma fijo en espanol de Uruguay (fechas, numeros). Al implementar RF-27 (espanol/ingles) cambiar a un resolver por sesion.
spring.web.locale=es_UY
spring.web.locale-resolver=fixed

# Sesiones: 30 minutos para turistas y prestadores (los administradores tienen 15, ver RoleBasedSuccessHandler)
server.servlet.session.timeout=30m

# Correo (RF-26). En desarrollo se usa Mailpit (ver compose.yaml): los correos se ven en http://localhost:8025
# Para mandar correos reales, cambiar host/puerto/usuario/contrasena por los de un servidor SMTP (ej. Gmail).
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=Uruguay Mnatural <no-reply@uruguaymnatural.uy>
app.mail.reply-to=soporte@uruguaymnatural.uy
# Direccion publica del sitio, para los enlaces de los correos
app.base-url=http://localhost:8080

# Datos de demostracion (emprendimientos y actividades ficticias) para ver el catalogo mientras no se puedan
# publicar actividades. Usuario prestador de demo: demo.prestador / Demo12345. Poner en false para no cargarlos.
app.demo-data.enabled=true

# Administrador inicial: se crea al arrancar si todavia no existe ningun administrador.
# Cambiar la contrasena antes de entregar o desplegar.
app.admin.username=admin
app.admin.email=admin@uruguaymnatural.uy
app.admin.password=Admin12345
app.admin.first-name=Administrador
app.admin.last-name=Uruguay Mnatural
