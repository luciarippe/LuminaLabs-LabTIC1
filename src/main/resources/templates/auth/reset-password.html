<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!-- Recuperar la contrasena, paso 2: desde el enlace del correo se elige la contrasena nueva.
     Si el enlace no sirve, se explica por que (invalidMessage). -->
<head th:replace="~{fragments/layout :: head('Elegir una contraseña nueva')}"></head>
<body>
<header th:replace="~{fragments/layout :: header(true)}"></header>

<main class="auth-wrap">
    <!-- El enlace ya se uso o vencio -->
    <div class="auth-card" th:if="${invalidMessage != null}">
        <div class="empty-state invitation-invalid">
            <div class="empty-state__icon"><svg th:replace="~{fragments/icons :: icon-sized('mail', '')}"></svg></div>
            <h3>El enlace no está disponible</h3>
            <p th:text="${invalidMessage}">Motivo</p>
            <a class="btn btn--primary" th:href="@{/password/forgot}">Pedir un enlace nuevo</a>
        </div>
    </div>

    <div class="auth-card" th:if="${invalidMessage == null}">
        <h1>Elegí una contraseña nueva</h1>
        <p class="muted">Para la cuenta <strong th:text="|@${username}|">@usuario</strong>. Después vas a poder iniciar
            sesión con tu nombre de usuario o tu correo y la contraseña nueva.</p>

        <form th:action="@{/password/reset/{token}(token=${token})}" th:object="${form}" method="post" novalidate>
            <div class="field">
                <label for="newPassword">Contraseña nueva</label>
                <div class="input-group">
                    <input class="input" type="password" th:field="*{newPassword}" th:errorclass="is-invalid"
                           autocomplete="new-password" autofocus>
                    <button type="button" class="input-group__action" data-toggle-password="newPassword">Mostrar</button>
                </div>
                <span class="hint">Entre 8 y 72 caracteres.</span>
                <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
            </div>
            <div class="field">
                <label for="confirmPassword">Repetir contraseña nueva</label>
                <input class="input" type="password" th:field="*{confirmPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </div>
            <button type="submit" class="btn btn--primary btn--lg btn--block">Guardar contraseña</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
