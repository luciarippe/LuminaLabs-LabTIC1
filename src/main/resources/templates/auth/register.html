<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<header th:replace="~{fragments/layout :: header(true)}"></header>

<main class="auth-wrap">
        <div class="auth-card auth-card--wide">
            <h1>Crear cuenta</h1>
            <p class="muted">Explorar es libre; para reservar y dejar tu opinión necesitás una cuenta.
                ¿Ofrecés experiencias? <a th:href="@{/register/provider}">Registrá tu emprendimiento</a>.</p>

            <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                <div class="alert alert--error" role="alert" th:if="${#fields.hasErrors('*')}">
                    <strong>Revisá los campos marcados.</strong>
                </div>

                <div class="form-grid">
                    <div class="field">
                        <label for="firstName">Nombre</label>
                        <input class="input" type="text" th:field="*{firstName}" th:errorclass="is-invalid" autocomplete="given-name" autofocus>
                        <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                    </div>
                    <div class="field">
                        <label for="lastName">Apellido</label>
                        <input class="input" type="text" th:field="*{lastName}" th:errorclass="is-invalid" autocomplete="family-name">
                        <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                    </div>
                    <div class="field">
                        <label for="birthDate">Fecha de nacimiento</label>
                        <input class="input" type="date" th:field="*{birthDate}" th:errorclass="is-invalid" autocomplete="bday">
                        <span class="field-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>
                    </div>
                    <div class="field">
                        <label for="username">Nombre de usuario</label>
                        <input class="input" type="text" th:field="*{username}" th:errorclass="is-invalid" autocomplete="username">
                        <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                    </div>
                    <div class="field span-2">
                        <label for="email">Correo electrónico</label>
                        <input class="input" type="email" th:field="*{email}" th:errorclass="is-invalid" autocomplete="email">
                        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                        <span class="hint" th:if="${#fields.hasErrors('email')}">
                            ¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a>
                        </span>
                    </div>
                    <div class="field">
                        <label for="password">Contraseña</label>
                        <div class="input-group">
                            <input class="input" type="password" th:field="*{password}" th:errorclass="is-invalid" autocomplete="new-password">
                            <button type="button" class="input-group__action" data-toggle-password="password">Mostrar</button>
                        </div>
                        <span class="hint">Mínimo 8 caracteres.</span>
                        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Repetir contraseña</label>
                        <input class="input" type="password" th:field="*{confirmPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                        <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                    </div>
                </div>

                <button type="submit" class="btn btn--primary btn--lg btn--block">Crear cuenta</button>
            </form>

            <div class="auth-card__footer">
                <p>¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a></p>
            </div>
        </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
