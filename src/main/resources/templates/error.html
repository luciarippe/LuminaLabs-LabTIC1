<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<header th:replace="~{fragments/layout :: header(true)}"></header>
<main class="container page">
    <div class="card result-card">
        <div class="result-card__icon result-card__icon--neutral" th:text="${status}">500</div>
        <h1 th:text="${status == 404} ? 'No encontramos lo que buscás' : 'Algo salió mal'">Algo salió mal</h1>
        <p class="muted" th:text="${status == 404} ? 'La página no existe o ya no está disponible.' : 'Ocurrió un error inesperado. Intentá de nuevo en unos minutos.'"></p>
        <a class="btn btn--dark" th:href="@{/}">Volver al inicio</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
