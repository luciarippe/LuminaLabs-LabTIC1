# Perfil "mercadopago": cobra con el sandbox de Mercado Pago en vez de la pasarela simulada (ver MercadoPagoPaymentGateway).
# Se activa arrancando la aplicacion con el perfil: SPRING_PROFILES_ACTIVE=mercadopago
#
# Credenciales de PRUEBA (panel de Mercado Pago Developers > Tus integraciones > la aplicacion > Credenciales de prueba).
# NUNCA se escriben en este archivo ni se suben a Git. Hay dos formas de pasarlas:
#  a) Variables de entorno MERCADOPAGO_ACCESS_TOKEN y MERCADOPAGO_PUBLIC_KEY.
#  b) Un archivo mercadopago-credentials.properties en la carpeta del proyecto (esta en el .gitignore) con:
#       app.mercadopago.access-token=...
#       app.mercadopago.public-key=...
spring.config.import=optional:file:./mercadopago-credentials.properties

app.payments.provider=mercadopago
app.mercadopago.base-url=https://api.mercadopago.com
# Secreta: identifica nuestra cuenta. Solo la usa el servidor.
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
# Publica: la usa el navegador para que Mercado Pago genere el token de la tarjeta
app.mercadopago.public-key=${MERCADOPAGO_PUBLIC_KEY:}

# Una pasarela real por internet tarda mas que la simulada: se le da mas tiempo antes de considerar el pago "sin respuesta"
app.payments.timeout-millis=10000
