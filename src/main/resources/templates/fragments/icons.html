<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!-- Iconos de linea. Uso: <svg th:replace="~{fragments/icons :: icon-sized('calendar', '')}"></svg>
     El segundo parametro es una clase de tamano opcional: '' (20px), 'icon--sm' (16px) o 'icon--lg' (28px). -->

<svg th:fragment="icon-sized(name, size)" th:class="|icon ${size}|" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <th:block th:switch="${name}">
        <g th:case="'search'"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g>
        <g th:case="'pin'"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></g>
        <g th:case="'calendar'"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></g>
        <g th:case="'clock'"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
        <g th:case="'language'"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></g>
        <g th:case="'user'"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>
        <g th:case="'users'"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></g>
        <g th:case="'accessibility'"><circle cx="12" cy="4.5" r="1.5"/><path d="M5 8.5 12 10l7-1.5M12 10v4M9 21l3-7 3 7"/></g>
        <g th:case="'check'"><path d="m5 12.5 4.5 4.5L19 7"/></g>
        <g th:case="'info'"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></g>
        <g th:case="'arrow-right'"><path d="M5 12h14M13 6l6 6-6 6"/></g>
        <g th:case="'building'"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/></g>
        <g th:case="'shield'"><path d="M12 3 19 6v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"/><path d="m9 12 2 2 4-4"/></g>
        <g th:case="'lock'"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g>
        <g th:case="'star'"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></g>
        <g th:case="'compass'"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></g>
        <g th:case="'grid'"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g>
        <g th:case="'inbox'"><path d="M3 13h5l1.5 3h5l1.5-3h5"/><path d="M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></g>
        <g th:case="'external'"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></g>
        <g th:case="'mail'"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g>
        <g th:case="'alert'"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/></g>
        <g th:case="'logout'"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></g>
        <g th:case="'phone'"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></g>
        <g th:case="'bank'"><path d="M3 10h18M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18M12 3l9 5H3z"/></g>
        <g th:case="'id-card'"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16a3 3 0 0 1 6 0M15 10h3M15 14h3"/></g>
        <g th:case="'user-plus'"><circle cx="10" cy="8" r="4"/><path d="M3 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></g>
        <g th:case="'key'"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M16 7l2.5 2.5M14 9l2 2"/></g>
        <g th:case="'x-circle'"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></g>
        <g th:case="'pause'"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></g>
        <g th:case="'refresh'"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></g>
        <g th:case="'file-text'"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></g>
        <!-- Clima (WeatherCondition.icon) -->
        <g th:case="'sun'"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g>
        <g th:case="'cloud-sun'"><path d="M8 3.5v1.3M3.3 8.5h1.3M4.6 5.1l.9.9M11.4 5.1l-.9.9"/><path d="M5.6 10.6a3 3 0 0 1 5.3-2.5"/><path d="M8 20h9a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.4 1.6A3.2 3.2 0 0 0 8 20z"/></g>
        <g th:case="'cloud'"><path d="M7 19h10a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.4 1.6A3.7 3.7 0 0 0 7 19z"/></g>
        <g th:case="'rain'"><path d="M7 15h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.4 1.6A3.2 3.2 0 0 0 7 15z"/><path d="m8 18-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/></g>
        <g th:case="'storm'"><path d="M7 15h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.4 1.6A3.2 3.2 0 0 0 7 15z"/><path d="m12.5 15-2 3.5h3l-2 3.5"/></g>
        <g th:case="'fog'"><path d="M7 12h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.4 1.6"/><path d="M3 15h18M5 18.5h14M8 22h8"/></g>
        <g th:case="'snow'"><path d="M7 15h10a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.4 1.6A3.2 3.2 0 0 0 7 15z"/><path d="M8 19h.01M12 19h.01M16 19h.01M10 21.5h.01M14 21.5h.01"/></g>
        <g th:case="'droplet'"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></g>
        <g th:case="'wind'"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h7"/></g>
        <g th:case="'tag'"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></g>
        <g th:case="'edit'"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></g>
        <g th:case="'ticket'"><path d="M3 8a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2.5a1.5 1.5 0 0 0 0 3V16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2.5a1.5 1.5 0 0 0 0-3z"/><path d="M14 7v10" stroke-dasharray="2 2"/></g>
        <g th:case="'chevron-right'"><path d="m9 6 6 6-6 6"/></g>
        <g th:case="'image'"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5-9 9"/></g>
        <g th:case="'instagram'"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.3 6.7h.01"/></g>
        <g th:case="'facebook'"><path d="M14.5 8H16V4.5h-2.5A3.5 3.5 0 0 0 10 8v2.5H8V14h2v6.5h3.5V14h2.4l.6-3.5h-3V8.6c0-.4.3-.6.5-.6z"/></g>
        <g th:case="'tiktok'"><path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5M14 4c.4 2.4 2.2 4 4.5 4.2"/></g>
        <g th:case="'globe'"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></g>
        <g th:case="*"><circle cx="12" cy="12" r="9"/></g>
    </th:block>
</svg>
</body>
</html>
