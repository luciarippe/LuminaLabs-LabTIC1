spring.application.name=luminalabs

spring.datasource.url=jdbc:postgresql://localhost:5433/luminalabs
spring.datasource.username=lumina
spring.datasource.password=lumina

# Esquema de la base: lo crea y lo actualiza Flyway con los scripts de src/main/resources/db/migration
# (V1__..., V2__..., en orden; cada uno se aplica una sola vez y queda anotado en la tabla flyway_schema_history).
# Para cambiar el esquema: agregar un script nuevo con el numero siguiente. Nunca modificar uno ya subido a Git.
# Hibernate solo VALIDA que las entidades coincidan con las tablas: si falta una migracion, la app no arranca
# y el error dice que tabla o columna no coincide.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Las bases creadas antes de usar Flyway (con ddl-auto=update) ya tienen el esquema de V1: se marcan como
# "en V1" y solo se les aplican las migraciones siguientes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Usamos un AuthenticationProvider propio a proposito (ver SecurityConfig); oculta el aviso al arrancar
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Idioma fijo en espanol de Uruguay (fechas, numeros). Al implementar RF-27 (espanol/ingles) cambiar a un resolver por sesion.
spring.web.locale=es_UY
spring.web.locale-resolver=fixed

# Sesiones: 30 minutos para turistas y prestadores (los administradores tienen 15, ver RoleBasedSuccessHandler)
server.servlet.session.timeout=30m

# Correo (RF-26). En desarrollo se usa Mailpit (ver compose.yaml): los correos se ven en http://localhost:8025
# Para mandar correos reales, cambiar host/puerto/usuario/contrasena por los de un servidor SMTP (ej. Gmail).
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=Uruguay Mnatural <no-reply@uruguaymnatural.uy>
app.mail.reply-to=soporte@uruguaymnatural.uy
# Direccion publica del sitio, para los enlaces de los correos
app.base-url=http://localhost:8080

# Datos de demostracion (emprendimientos y actividades ficticias) para ver el catalogo mientras no se puedan
# publicar actividades. Usuario prestador de demo: demo.prestador / Demo12345. Poner en false para no cargarlos.
app.demo-data.enabled=true

# Administrador inicial: se crea al arrancar si todavia no existe ningun administrador.
# Cambiar la contrasena antes de entregar o desplegar.
app.admin.username=admin
app.admin.email=admin@uruguaymnatural.uy
app.admin.password=Admin12345
app.admin.first-name=Administrador
app.admin.last-name=Uruguay Mnatural

# Pagos (RF-17, RF-18). La pasarela es un servicio externo al que se llama por HTTP. En desarrollo se usa la
# pasarela simulada que corre dentro de esta misma aplicacion (paquete mockgateway); para una real, cambiar la URL.
app.payments.base-url=http://localhost:${server.port:8080}/mock-gateway
app.payments.currency=UYU
# Si la pasarela no responde en este tiempo, el pago queda "sin respuesta" (RF-18 9b)
app.payments.timeout-millis=3000
# La pasarela simulada tarda esto en responder con las tarjetas de timeout (mas que el timeout de arriba)
app.mock-gateway.slow-response-millis=5000

# Proceso automatico de reservas (CU-18): vencimientos, reservas terminadas y reintento de devoluciones
app.scheduler.enabled=true
app.scheduler.interval-millis=60000

# CSS, JS e imagenes con una huella de su contenido en la direccion (ej. /css/styles-3f2a....css): Thymeleaf
# la agrega sola en los @{...}. Cuando un archivo cambia, cambia su direccion y el navegador no usa una copia vieja.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Fotos de actividades y localidades: hasta 8 MB cada una (ImageProcessor.MAX_BYTES) y 8 por actividad.
# El pedido entero admite las 8 fotos mas los demas datos del formulario.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=70MB
# Tomcat corta la conexion si un pedido rechazado por tamano trae mas de esto; asi llega el aviso al usuario
server.tomcat.max-swallow-size=80MB
