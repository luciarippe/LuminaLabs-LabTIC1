# Perfil "test": se activa con @ActiveProfiles("test") y pisa solo lo que cambia respecto de application.properties.
# Usa una base H2 en memoria, asi "mvn test" no necesita Docker ni PostgreSQL.
spring.datasource.url=jdbc:h2:mem:luminalabs;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false

# Las migraciones de Flyway usan SQL propio de PostgreSQL (ej. bloques DO $$), que H2 no entiende.
# En los tests el esquema lo crea Hibernate desde las entidades; las migraciones se prueban al arrancar
# la app contra PostgreSQL, donde ddl-auto=validate falla si no coinciden con las entidades.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Sin servidor de correo en los tests: el envio falla rapido y solo queda un aviso en el log
spring.mail.port=1

# El proceso automatico (CU-18) no corre en los tests: cambiaria datos mientras se prueba
app.scheduler.enabled=false

# Los tests no llaman a la API de clima (no dependen de internet)
app.weather.enabled=false
